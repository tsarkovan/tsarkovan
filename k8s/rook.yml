apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v17.2.0
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: true
  storage:
    useAllNodes: true
    useAllDevices: false
    devices:
      - name: vdb  # твой единственный диск на ноде
    config:
      # Размер блока DB (metadata) — обычно 4% от размера основного диска
      databaseSizeMB: "4096"   # 8 GB — примерно 40% от 20 ГБ, можно уменьшить до 4096 если мало места

      # Размер WAL (логи операций)
      journalSizeMB: "1024"    # 1 GB — достаточно для тестов