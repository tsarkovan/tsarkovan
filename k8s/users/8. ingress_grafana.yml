adminPassword: "StrongPass123"

service:
  type: ClusterIP

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - grafana.k8s.yageroy.ru
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.k8s.yageroy.ru

persistence:
  enabled: true
  size: 1Gi
  storageClassName: rook-cephfs